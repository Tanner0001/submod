l_english:
 # --- Decision categories ---
 wotc_entente_command: "Entente High Command"
 wotc_entente_command_desc: "Direct the global war effort of the Entente as its leader: run a lend-lease pipeline, steer an ally's war planning, and prepare joint invasions."
 wotc_49th_parallel: "The 49th Parallel"
 wotc_49th_parallel_desc: "Manage the spillover of the Second American Civil War across the border, from quiet border security to open intervention, as tension with the WCA and APG rises."
 wotc_operation_homecoming: "Operation Homecoming"
 wotc_operation_homecoming_desc: "Plan the reclamation of the British Isles: secure Iceland and the Faroe Islands as staging grounds, take Shetland in battle, then commit to the landing."

 # --- Entente High Command decisions ---
 wotc_toggle_shared_arsenal: "Establish Shared Arsenal"
 wotc_toggle_shared_arsenal_desc: "Toggle a standing lend-lease arrangement with our Entente allies. While active, it costs some consumer goods output but unlocks repeatable equipment shipments below."
 wotc_shared_arsenal_transfer: "Dispatch Shared Arsenal Shipment"
 wotc_shared_arsenal_transfer_desc: "Ship 500 infantry equipment from our own stockpile to the chosen ally. Requires Shared Arsenal to be active; repeatable every 30 days."
 wotc_objective_mandate: "Issue Objective Mandate"
 wotc_objective_mandate_desc: "Use our standing as Entente leader to bias the chosen ally's war planning toward preparing for war with Britain specifically, for the next 60 days."
 wotc_joint_invasion_prep: "Prepare Joint Invasion"
 wotc_joint_invasion_prep_desc: "Draw on strong Entente cohesion to grant ourselves a temporary logistics bonus ahead of a joint invasion, for 14 days."

 # --- 49th Parallel decisions ---
 wotc_border_guard_deployment: "Deploy Border Guards"
 wotc_border_guard_deployment_desc: "A one-time deployment: raise 3 RCMP Emergency Response Team divisions and garrison them at Toronto, Quebec, and Winnipeg to secure the border approaches."
 wotc_covert_infantry_aid: "Funnel Infantry Equipment"
 wotc_covert_infantry_aid_desc: "Covertly ship 200 infantry equipment across the border to friendly forces. Raises border tension each time it's used; repeatable every 30 days."
 wotc_sabotage_rail_hubs: "Sabotage Rail Hubs"
 wotc_sabotage_rail_hubs_desc: "Order covert operatives to disrupt factory output and resources in every hostile-held border state for 60 days. Raises border tension each time it's used."
 wotc_intervention_war_justification: "Cross the Line"
 wotc_intervention_war_justification_desc: "Abandon restraint: justify direct war against the WCA and/or APG outright, bypassing the usual World Tension requirement. Costs stability, more so under an authoritarian government."

 # --- Operation Homecoming decisions (redesigned) ---
 wotc_ice_overture: "Overture to Reykjavik"
 wotc_ice_overture_desc: "Open quiet negotiations with the Icelandic government over the use of their ports and airfields. Begins a 45-day diplomatic buildup before Iceland can be secured outright."
 wotc_ice_occupy: "Secure Iceland"
 wotc_ice_occupy_desc: "Once the 45-day buildup has elapsed, annex Iceland outright, expand its naval base, and gain a lasting intelligence bonus."
 wotc_faroe_overture: "Overture to Torshavn"
 wotc_faroe_overture_desc: "With Iceland secured, open the same quiet negotiations with the Danish administration of the Faroe Islands. Begins a 30-day diplomatic buildup."
 wotc_faroe_annex: "Secure the Faroe Islands"
 wotc_faroe_annex_desc: "Once the 30-day buildup has elapsed, annex the Faroe Islands outright and expand their naval base - a forward staging point closer to Britain than Iceland could ever be."
 wotc_shetland_secure_footing: "Establish a Foothold in Shetland"
 wotc_shetland_secure_footing_desc: "Only available once our forces have actually taken Orkney and Shetland in battle. Formalizes use of its existing naval base and supply hub for a lasting logistics bonus."
 wotc_phase3_commit_to_the_landing: "Commit to the Landing"
 wotc_phase3_commit_to_the_landing_desc: "Requires both the Faroe Islands and Shetland secured. Grants a major invasion bonus for the first 4 days of the landing, tapering to a lighter bonus for the remaining 10."

 # --- Ideas: Exiles vs. Autonomy ---
 wotc_idea_sovereignty: "Canadian Sovereignty"
 wotc_idea_sovereignty_desc: "The domestic parliament holds the reins, prioritizing stability and industry over the Crown's ambitions."
 wotc_idea_kings_compromise: "The King's Compromise"
 wotc_idea_kings_compromise_desc: "An uneasy balance between the Exiles and the parliament, maintained only through constant political effort."
 wotc_idea_exile_dominance: "Exile Dominance"
 wotc_idea_exile_dominance_desc: "The British Exiles have the upper hand, marshalling Canada wholly behind the reconquest of the homeland - at a cost."

 # --- Ideas: 49th Parallel tension ---
 wotc_idea_tension_observation: "Border Observation"
 wotc_idea_tension_observation_desc: "The border is quiet, but we are watching."
 wotc_idea_tension_covert_proxy: "Covert Proxy War"
 wotc_idea_tension_covert_proxy_desc: "Our covert involvement south of the border is straining domestic patience."
 wotc_idea_tension_intervention: "Open Intervention Footing"
 wotc_idea_tension_intervention_desc: "The nation braces for direct involvement in the American war."

 # --- Ideas: Entente High Command ---
 wotc_idea_shared_arsenal_active: "Shared Arsenal Active"
 wotc_idea_shared_arsenal_active_desc: "Canadian industry is diverting output to arm our Entente allies."
 wotc_idea_entente_cohesion_low: "Entente Cohesion: Fragile"
 wotc_idea_entente_cohesion_low_desc: "Our leadership of the Entente has yet to earn the full confidence of our allies."
 wotc_idea_entente_cohesion_high: "Entente Cohesion: Strong"
 wotc_idea_entente_cohesion_high_desc: "Our allies trust Canadian leadership enough to commit to joint operations."

 # --- Ideas: Operation Homecoming ---
 wotc_idea_north_sea_intel: "North Sea Intelligence Network"
 wotc_idea_north_sea_intel_desc: "Our Icelandic radar outposts give us a clear picture of enemy naval movements."
 wotc_idea_shetland_staging_bonus: "Shetland Staging Base"
 wotc_idea_shetland_staging_bonus_desc: "The naval base and supply hub at Shetland dramatically shorten our logistical tail for operations against Britain."
 wotc_idea_homecoming_landing_bonus_peak: "Homecoming: The Beachhead"
 wotc_idea_homecoming_landing_bonus_peak_desc: "Every resource is bent toward securing the initial beachhead in Britain."
 wotc_idea_homecoming_landing_bonus: "Homecoming: Consolidating the Front"
 wotc_idea_homecoming_landing_bonus_desc: "The beachhead is secure - the push inland continues at a steadier pace."

 # --- Operation Anvil (NFA) ---
 wotc_operation_anvil: "Operation Anvil"
 wotc_operation_anvil_desc: "Plan the invasion of the Commune of France with American naval support."
 wotc_anvil_request_american_support: "Request American Support"
 wotc_anvil_request_american_support_desc: "Formally request that the United States commit naval and logistical support to the liberation of France."
 wotc_anvil_stage_invasion_fleet: "Stage the Invasion Fleet"
 wotc_anvil_stage_invasion_fleet_desc: "Assemble the combined Franco-American invasion fleet."
 wotc_anvil_launch: "Launch Operation Anvil"
 wotc_anvil_launch_desc: "The order is given - France will be free again."
 wotc_idea_anvil_landing_bonus: "Operation Anvil: The Landing"
 wotc_idea_anvil_landing_bonus_desc: "Franco-American forces are fully committed to securing the beachhead."

 # --- Dominion Solidarity ---
 wotc_dominion_solidarity: "Dominion Solidarity"
 wotc_dominion_solidarity_desc: "Extend Canadian support to the Dominion of India in its struggle against the Bharatiya Peoples Republic."
 wotc_raj_dispatch_advisors: "Dispatch Military Advisors"
 wotc_raj_dispatch_advisors_desc: "Send Canadian military advisors to help train and organize Indian forces."
 wotc_raj_equipment_shipment: "Ship Equipment to India"
 wotc_raj_equipment_shipment_desc: "Send a shipment of surplus equipment to the Dominion of India."
 wotc_raj_joint_offensive: "Coordinate a Joint Offensive"
 wotc_raj_joint_offensive_desc: "Commit Canadian planning and materiel to a joint offensive against the Bharatiya Peoples Republic."
 wotc_idea_raj_advisor_support: "Canadian Military Advisors"
 wotc_idea_raj_advisor_support_desc: "Canadian advisors are helping organize and train the Indian Army."
 wotc_idea_raj_offensive_bonus: "Joint Offensive Footing"
 wotc_idea_raj_offensive_bonus_desc: "Indian forces are fully coordinated with Canadian planning for the offensive."

 # --- Dominion Solidarity (Canada -> NAT) ---
 wotc_natal_dispatch_advisors: "Dispatch Military Advisors to Natal"
 wotc_natal_dispatch_advisors_desc: "Send Canadian military advisors to help train and organize Natal's forces."
 wotc_natal_equipment_shipment: "Ship Equipment to Natal"
 wotc_natal_equipment_shipment_desc: "Send a shipment of surplus equipment to Natal."
 wotc_natal_joint_offensive: "Coordinate a Joint Offensive with Natal"
 wotc_natal_joint_offensive_desc: "Commit Canadian planning and materiel to Natal's war for survival."
 wotc_idea_natal_advisor_support: "Canadian Military Advisors"
 wotc_idea_natal_advisor_support_desc: "Canadian advisors are helping organize and train Natal's forces."
 wotc_idea_natal_offensive_bonus: "Joint Offensive Footing"
 wotc_idea_natal_offensive_bonus_desc: "Natal's forces are fully coordinated with Canadian planning."

 # --- Liberation of Fallen Allies (generalized) ---
 wotc_liberation_of_allies: "Liberation of Fallen Allies"
 wotc_liberation_of_allies_desc: "An Entente ally has fallen. Offer them sanctuary and lead the effort to take their homeland back."
 wotc_offer_sanctuary: "Offer Sanctuary"
 wotc_offer_sanctuary_desc: "Extend Canadian protection to the government of our fallen ally."
 wotc_rally_free_legions: "Rally the Free Legions"
 wotc_rally_free_legions_desc: "Raise volunteer forces from among our fallen ally's exiles and refugees."
 wotc_declare_liberation: "Declare the Liberation"
 wotc_declare_liberation_desc: "Commit Canada to driving the occupier out and restoring our ally's homeland."
 wotc_idea_free_legions_support: "Free Legions"
 wotc_idea_free_legions_support_desc: "Volunteer forces raised from among our ally's exiles are fighting alongside us."
 wotc_idea_liberation_offensive_bonus: "Liberation Offensive"
 wotc_idea_liberation_offensive_bonus_desc: "Every resource is bent toward liberating our ally's homeland."

 # --- Events ---
 wotc_canada.10.t: "Trouble on the Border"
 wotc_canada.10.d: "Reports are coming in of an incident along the 49th Parallel - shots exchanged, a border post overrun, refugees fleeing north. The government must decide how to respond."
 wotc_canada.10.a: "Respond firmly"
 wotc_canada.10.b: "De-escalate quietly"

 wotc_canada.11.t: "Draft Riots"
 wotc_canada.11.d: "The Exiles' push for total mobilization has finally boiled over. Riots have broken out in several cities, with French-Canadian communities especially incensed."
 wotc_canada.11.a: "Concede ground to the parliament"
 wotc_canada.11.b: "Suppress the unrest"

 wotc_canada.30.t: "The Weight of the Crown"
 wotc_canada.30.d: "This game is running the Weight of the Crown submod - new decisions for Canada (Exiles vs. Autonomy, the 49th Parallel, Operation Homecoming), Entente High Command, and Operation Anvil for NatFrance are active."
 wotc_canada.30.a: "Understood"

 wotc_canada.40.t: "The Fate of a Homeland"
 wotc_canada.40.d: "The war is won. Our former ally's occupier has capitulated, and the fate of their homeland now rests in Canadian hands. What shall we do with it?"
 wotc_canada.40.a: "Restore their independence - it was never ours to keep"
 wotc_canada.40.b: "Restore their government, but as a protectorate under the Crown"
 wotc_canada.40.c: "Absorb the conquerors themselves as a Canadian subject state"
